title: New Vision NV3007 TFT LCD controller

description: |
  The New Vision NV3007 is a 262K colors TFT LCD controller with a
  168RGBx428 frame memory, driven over SPI. The driver writes 16-bit
  RGB565 pixels, most significant byte first (PIXEL_FORMAT_RGB_565X).

  Panels narrower than the frame memory sit at an offset in it, given by
  x-offset and y-offset in the orientation that madctl selects.

compatible: "newvision,nv3007"

include: [mipi-dbi-spi-device.yaml, display-controller.yaml]

properties:
  x-offset:
    type: int
    default: 0
    description: First frame memory column of the panel.

  y-offset:
    type: int
    default: 0
    description: First frame memory row of the panel.

  madctl:
    type: int
    default: 0x0
    description: |
      Memory data access control value (MY MX MV ML BGR MH). It sets the
      scan direction and orientation, for example 0xA0 (MY | MV) for a
      landscape panel rotated by 270 degrees.

  color-invert:
    type: boolean
    description: Inverts the display colors.

examples:
  - |
    #include <zephyr/dt-bindings/gpio/gpio.h>
    #include <zephyr/dt-bindings/mipi_dbi/mipi_dbi.h>

    mipi_dbi {
      compatible = "zephyr,mipi-dbi-spi";
      spi-dev = <&spi2>;
      dc-gpios = <&gpio1 7 GPIO_ACTIVE_HIGH>;
      reset-gpios = <&gpio1 8 GPIO_ACTIVE_LOW>;
      write-only;
      #address-cells = <1>;
      #size-cells = <0>;

      lcd@0 {
        compatible = "newvision,nv3007";
        reg = <0>;
        mipi-max-frequency = <80000000>;
        mipi-mode = "MIPI_DBI_MODE_SPI_4WIRE";
        width = <428>;
        height = <142>;
        madctl = <0xa0>;
        y-offset = <12>;
      };
    };
